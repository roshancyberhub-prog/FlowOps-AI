# Overlay: docker compose -f docker-compose.yml -f deployment/compose.production.yml ...
services:
  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      WEB_ORIGIN: https://${FLOWOPS_DOMAIN:?Set FLOWOPS_DOMAIN to the public hostname}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      DEMO_RETRY_FAILURE: "false"
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=172.30.80.10", "--no-access-log", "--no-server-header"]
  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      WEB_ORIGIN: https://${FLOWOPS_DOMAIN}
      DEMO_RETRY_FAILURE: "false"
  scheduler:
    restart: unless-stopped
    environment:
      APP_ENV: production
      WEB_ORIGIN: https://${FLOWOPS_DOMAIN}
      DEMO_RETRY_FAILURE: "false"
  web:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FLOWOPS_DOMAIN: ${FLOWOPS_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.80.10
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
volumes:
  redis_data:
  caddy_data:
  caddy_config:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24

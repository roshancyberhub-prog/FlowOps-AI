name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
          POSTGRES_DB: flowops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://flowops:flowops@localhost:5432/flowops_test
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Audit locked Python runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --quiet -o /tmp/flowops-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/flowops-requirements.txt --require-hashes --disable-pip --progress-spinner off
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - name: Verify real public GitHub integration (read only)
        run: |
          uv run python - <<'PYCODE'
          import asyncio
          from app.integrations.github import repository
          result = asyncio.run(repository("octocat", "Hello-World"))
          assert result["full_name"] == "octocat/Hello-World"
          print("Public GitHub repository metadata verified:", result["full_name"])
          PYCODE
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
  web:
    needs: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Validate and start the documented Docker stack
        working-directory: .
        run: |
          python3 scripts/setup-env.py
          printf '\nDEMO_RETRY_FAILURE=true\n' >> .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 240
      - run: npx playwright test
        env:
          E2E_EXTERNAL: "1"
      - name: Validate production configuration without deploying
        working-directory: .
        env:
          FLOWOPS_DOMAIN: demo.example.com
        run: |
          docker compose -f docker-compose.yml -f deployment/compose.production.yml config --quiet
          docker run --rm -e FLOWOPS_DOMAIN=demo.example.com -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify isolated PostgreSQL backup and restore
        working-directory: .
        run: RESTORE_DRILL=1 bash scripts/verify-restore.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: apps/web/test-results/
      - name: Show logs and stop services
        if: always()
        working-directory: .
        run: |
          docker compose logs --tail 80
          docker compose down

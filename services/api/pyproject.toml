[project]
name = "flowops-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy[asyncio]>=2.0.55,<2.1",
  "asyncpg>=0.32,<0.33",
  "alembic>=1.20,<1.21",
  "fastapi-users[sqlalchemy]>=15.0.5,<16",
  "pydantic-settings>=2.16,<3",
  "redis>=6.4,<6.5",
  "python-json-logger>=4.2,<5",
  "celery[redis]>=5.6,<5.7",
  "kombu>=5.6,<5.7",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<0.18", "mypy>=2.4,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires migrated PostgreSQL and Redis"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
